<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
{% seo %}
{% feed_meta %}
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
<header class="nav">
  <div class="wrap">
    <a class="name" href="{{ '/' | relative_url }}">Mihir Ajmera</a>
    <div class="nav-right">
      <ul>
        <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Ledger</a></li>
        <li><a href="{{ '/work/' | relative_url }}"{% if page.url contains '/work/' %} aria-current="page"{% endif %}>Work</a></li>
        <li><a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog/' %} aria-current="page"{% endif %}>Writing</a></li>
      </ul>
      <button class="theme-switch" role="switch" aria-checked="false" aria-label="Switch to dark mode">
        <svg class="ico sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ico moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span class="knob"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="12" cy="12" r="3"/></svg></span>
      </button>
    </div>
  </div>
</header>

{{ content }}

<footer class="site">
  <div class="wrap">
    <span>© {{ site.time | date: '%Y' }} Mihir Ajmera · Views are my own.</span>
    <nav aria-label="Elsewhere">{% for p in site.data.profiles %}{% if p.url != "" %}<a href="{{ p.url | relative_url }}">{{ p.name }}</a>{% endif %}{% endfor %}<a href="{{ '/links/' | relative_url }}">All links</a></nav>
  </div>
</footer>
<script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
