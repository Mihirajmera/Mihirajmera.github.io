# Single source for the home page and the /projects/ directory.
# flagship: shown as large cards on the home page.
- name: agent-access-review
  category: AI assurance
  flagship: true
  kicker: AGENTIC AI · ACCESS GOVERNANCE
  summary: >-
    User access reviews for AI agents. Reads MCP configs (Claude Desktop, Cursor, VS Code) and
    agent manifests, inventories what each agent can read, write, execute and send, and tests it
    against 12 controls.
  bullets:
    - Flags unowned agents, stale approvals, over-broad scopes, plaintext secrets and dormant access, like an ITGC access review.
    - Detects exfiltration paths, where one agent reads sensitive data, ingests attacker-controlled content and can send data out.
  tags: [NIST 800-53, SOC 2, NIST AI RMF, OWASP LLM Top 10, OSCAL]
  install: "pip install agent-access-review\nagent-access-review demo"
  repo: https://github.com/Mihirajmera/agent-access-review
  links:
    - {label: Sample review packet, url: "https://github.com/Mihirajmera/agent-access-review/blob/main/sample-output/access-review.md"}

- name: llm-redteam-evidence
  category: AI assurance
  flagship: true
  kicker: AI SECURITY · AI ASSURANCE
  summary: >-
    Turns LLM red-team results from garak and promptfoo into audit evidence. Every attack maps to
    a control with a documented risk tolerance and a 95% confidence bound.
  bullets:
    - Release gate that blocks a new model version that's measurably easier to attack than the approved one.
    - Hashed evidence traceable to the raw tool output, plus OSCAL results for GRC platforms.
  tags: [OWASP LLM Top 10, MITRE ATLAS, NIST AI 600-1, NIST AI RMF, OSCAL]
  install: "pip install llm-redteam-evidence\nredteam-evidence demo"
  repo: https://github.com/Mihirajmera/llm-redteam-evidence
  links:
    - {label: Sample assessment, url: "https://github.com/Mihirajmera/llm-redteam-evidence/blob/main/sample-output/v2/report.md"}

