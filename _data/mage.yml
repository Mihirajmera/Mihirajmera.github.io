      MS in Cybersecurity from the University of Maryland, Baltimore County (UMBC), and a bachelor's in
      Computer Engineering with honors in cybersecurity from the University of Mumbai. Certifications: AWS
      Solutions Architect Associate, CompTIA Security+, ISACA CMMI Certified Practitioner and the Google
      Cybersecurity Professional certificate.
    next: [experience, roles]

  - id: principles
    label: How does he think about GRC?
    keys: [principles, philosophy, approach, believe, think, beliefs, method, how does he work]
    text: >-
      Four principles. Compliance should compile: controls are code, tested continuously. If it can't be
      re-performed, it isn't evidence. A score is an opinion until someone checks it. And AI agents are
      identities, so review their access like any privileged user's.
    next: [why, writing]

