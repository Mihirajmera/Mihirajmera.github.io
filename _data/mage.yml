    label: Where does he write?
    keys: [writing, blog, posts, articles, read, newsletter, linkedin posts, notes, essays]
    text: >-
      He publishes short notes most weekdays and a longer essay with original research about once a week,
      on this site and on LinkedIn. There's an RSS feed if you'd rather not miss one.
    links:
      - {label: Read the writing, url: /blog/}
      - {label: RSS, url: /feed.xml}
