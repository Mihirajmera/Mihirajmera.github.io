      pip install -e . pytest && python -m pytest -q
- n: "9"
  what: repositories ship releases with signed SLSA Level 3 build provenance.
  src: v0.2.1 release
  url: https://github.com/Mihirajmera/llm-redteam-evidence/releases/tag/v0.2.1
  span: 6
  verify:
    hash_label: Release commit for llm-redteam-evidence v0.2.1
    hash: 040931041c5cbf2f81000d7cdda805450036cd5a
    note: >-
      Each release attaches a signed provenance file (multiple.intoto.jsonl) generated by GitHub
      Actions, proving the artifacts were built by the release workflow from this repository.
    how: |
      gh release download v0.2.1 -R Mihirajmera/llm-redteam-evidence
      slsa-verifier verify-artifact llm_redteam_evidence-0.2.1-py3-none-any.whl \
        --provenance-path multiple.intoto.jsonl \
        --source-uri github.com/Mihirajmera/llm-redteam-evidence --source-tag v0.2.1
