  what: official MCP README configs run unpinned packages on every start.
  src: read the study
  url: /blog/what-mcp-readmes-teach-you-to-copy/
  tone: red
  span: 4
  verify:
    hash_label: Commit with the configs, sources and results
    hash: 96f44ee1b5ee943f1b73fe87096481184ba114cc
